[package]
name = "opensms"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Async Rust SDK for the OpenSMS prepaid SMS API (messages, batches, OTP, lookups, contacts, templates, webhooks, numbers, sender IDs, wallet, analytics)."
repository = "https://github.com/opensms-io/opensms-sdks"
homepage = "https://opensms.io"
documentation = "https://docs.rs/opensms"
readme = "README.md"
keywords = ["sms", "opensms", "otp", "messaging", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
